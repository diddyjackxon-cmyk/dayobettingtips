<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayoBettingTips Slideshow</title>
<style>
  /* Mtindo wa nje wa boksi la picha */
  .slideshow-container {
    max-width: 1000px;
    position: relative;
    margin: auto;
    overflow: hidden; /* Kuficha picha zilizoko pembeni */
    border: 2px solid #ccc;
    border-radius: 10px;
    margin-top: 20px;
  }

  /* Mtindo wa picha zenyewe */
  .mySlides {
    display: none; /* Zisizoonekana zote kwa pamoja */
    width: 100%;   /* Kujaza upana wote */
    height: 300px;  /* Urefu maalum (unaweza kubadilisha) */
    object-fit: cover; /* Kuhakikisha picha haipotezi umbo */
  }

  /* Mtindo wa namba za chini (Dots) */
  .dot-container {
    text-align: center;
    padding: 10px;
    background: #f1f1f1;
  }
  .dot {
    cursor: pointer;
    height: 15px;
    width: 15px;
    margin: 0 2px;
    background-color: #bbb;
    border-radius: 50%;
    display: inline-block;
    transition: background-color 0.6s ease;
  }
  .active, .dot:hover {
    background-color: #717171;
  }

  /* Uhuishaji (Animation) wa picha kuingia */
  .fade {
    -webkit-animation-name: fade;
    -webkit-animation-duration: 1.5s;
    animation-name: fade;
    animation-duration: 1.5s;
  }

  @-webkit-keyframes fade {
    from {opacity: .4}
    to {opacity: 1}
  }

  @keyframes fade {
    from {opacity: .4}
    to {opacity: 1}
  }
</style>
</head>
<body>

<!-- Sehemu ya Picha -->
<div class="slideshow-container">

  <!-- Picha ya Kwanza -->
  <!-- Badilisha '1000041504.png' na jina la picha yako ya kwanza -->
  <img class="mySlides fade" src="1000041504.png" alt="DayoBettingTips Banner 1">

  <!-- Picha ya Pili -->
  <!-- Badilisha 'banner2.jpg' na jina la picha yako ya pili -->
  <img class="mySlides fade" src="banner2.jpg" alt="DayoBettingTips Banner 2">

  <!-- Picha ya Tatu -->
  <!-- Badilisha 'banner3.jpg' na jina la picha yako ya tatu -->
  <img class="mySlides fade" src="banner3.jpg" alt="DayoBettingTips Banner 3">

</div>
<br>

<!-- Sehemu ya vidude vya kubadili picha chini (Dots) -->
<div class="dot-container">
  <span class="dot" onclick="currentSlide(1)"></span>
  <span class="dot" onclick="currentSlide(2)"></span>
  <span class="dot" onclick="currentSlide(3)"></span>
</div>

<script>
// JavaScript kwa ajili ya kubadilisha picha yenyewe
var slideIndex = 0;
showSlides();

function showSlides() {
  var i;
  var slides = document.getElementsByClassName("mySlides");
  var dots = document.getElementsByClassName("dot");
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  slideIndex++;
  if (slideIndex > slides.length) {slideIndex = 1}
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";
  dots[slideIndex-1].className += " active";
  setTimeout(showSlides, 3000); // Picha inabadilika kila sekunde 3 (3000ms)
}

function currentSlide(n) {
  showSlidesIndex(slideIndex = n);
}
</script>

</body>
</html>
